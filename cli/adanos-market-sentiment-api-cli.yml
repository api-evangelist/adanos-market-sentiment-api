  registry: pypi
  name: adanos-cli
  version: 1.33.0
  published: '2026-08-09'
commands:
  - command: adanos onboard wizard
    purpose: API key onboarding
  - command: adanos ask "How does TSLA look?"
    purpose: Human natural-language query mode
  - command: adanos --output json capabilities
    purpose: Machine mode, JSON output
  - command: adanos endpoint list
    purpose: Endpoint discovery
  - command: adanos endpoint call <endpoint-id>
    purpose: Full endpoint access
