name: adanos-cli
description: >-
  First-party CLI for the Adanos Market Sentiment API, documented in the provider's own llms.txt
  and API root discovery document. Offers a human query mode, a machine-readable JSON output mode,
  and generic access to every API endpoint.
install:
  - method: pip
    command: pip install adanos-cli
  - method: homebrew
    command: brew install adanos-software/tap/adanos-cli
    note: Tap published at github.com/adanos-software/homebrew-tap (Formula/adanos-cli.rb).
  - method: releases
    url: https://github.com/adanos-software/adanos-cli/releases
