    PolymarketTrendingCountry:
      properties:
        buzz_score:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Buzz Score
          description: Aggregated activity/flow buzz score using trades, volume, breadth, liquidity and participation
        trend:
          type: string
          enum:
          - rising
          - falling
          - stable
          title: Trend
          description: Flow momentum over the current 3 UTC days vs previous 3 UTC days using trades, volume, market breadth and liquidity; not price movement. For `from`/`to`, anchors at `to` (or now when `to` is today).
        trade_count:
          type: integer
          minimum: 0.0
          title: Trade Count
          description: Total trade count in period
        market_count:
          type: integer
          minimum: 0.0
          title: Market Count
          description: Sum of ticker-level catalog lifetime-overlap market counts in the selected UTC window for this dimension; not a cross-ticker condition-id union
        current_market_count:
          type: integer
          minimum: 0.0
          title: Current Market Count
          description: Sum of ticker-level currently open markets in the latest UTC-day snapshot; use this for live-only market breadth
        unique_tickers:
          type: integer
          minimum: 0.0
          title: Unique Tickers
          description: Unique tickers in dimension
        unique_traders:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Unique Traders
          description: Exact distinct union of observed proxy and explicit maker wallet hashes for the dimension and UTC window; null when retained wallet-level trades do not fully cover the window
        sentiment_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: -1.0
          - type: 'null'
          title: Sentiment Score
          description: Weighted implied sentiment; null when no underlying trades exist in the selected period
        bullish_pct:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Bullish Pct
          description: Outcome-aware bullish market percentage
        bearish_pct:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Bearish Pct
          description: Outcome-aware bearish market percentage
        total_liquidity:
          type: number
          minimum: 0.0
          title: Total Liquidity
          description: Windowed aggregated liquidity signal in USD over the selected period; not a current snapshot
        trend_history:
          items:
            type: number
          type: array
          title: Trend History
          description: Daily dimension buzz scores (oldest to newest). Length follows the resolved period, with a minimum of 7 values. Every slot describes only its UTC calendar day. The live final value describes today so far and can differ from period buzz_score. Closed historical windows end at `to`.
          examples:
          - - 48.2
            - 51.0
            - 55.3
            - 61.1
            - 65.8
            - 69.2
            - 72.8
        top_tickers:
          items:
            type: string
          type: array
          maxItems: 5
          title: Top Tickers
          description: Top 5 tickers by trade_count
        country:
          type: string
          title: Country
          description: Country name
          examples:
          - United States
      type: object
      required:
      - buzz_score
      - trend
      - trade_count
      - market_count
      - current_market_count
      - unique_tickers
      - bullish_pct
      - bearish_pct
      - total_liquidity
      - trend_history
      - top_tickers
      - country
      title: PolymarketTrendingCountry
      description: Trending country on Polymarket.
      examples:
      - buzz_score: 70.1
        trend: stable
        trade_count: 712
        market_count: 265
        current_market_count: 129
        unique_tickers: 10
        unique_traders: 402
        sentiment_score: 0.18
        bullish_pct: 58
        bearish_pct: 42
        total_liquidity: 472000.0
        trend_history:
        - 52.1
        - 54.0
        - 56.8
        - 59.2
        - 61.0
        - 60.1
        - 70.1
        top_tickers:
        - AAPL
        - TSLA
        - NVDA
        - AMZN
        - GOOGL
        country: United States
