components:
  schemas:
    PolymarketTickerPulse:
      properties:
        mood:
          type: string
          enum:
          - bullish
          - bearish
          - mixed
          - event_driven
          - illiquid
          - unclear
          title: Mood
          description: Current compact Polymarket interpretation for this ticker
        confidence:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Confidence
          description: Interpretation confidence capped by coverage, trade breadth, spread, liquidity and recency
        thin_data:
          type: boolean
          title: Thin Data
          description: True when current evidence is insufficient for a strong directional interpretation
        why:
          items:
            type: string
          type: array
          maxItems: 4
          minItems: 1
          title: Why
          description: Stable machine-readable reason codes explaining the pulse interpretation
        warnings:
          items:
            type: string
          type: array
          title: Warnings
          description: Stable machine-readable data quality, freshness and tradability warnings
        evidence:
          $ref: '#/components/schemas/PolymarketPulseEvidence'
          description: Compact non-duplicative quality summary for the pulse inputs
      type: object
      required:
      - mood
      - confidence
      - thin_data
      - why
      - evidence
      title: PolymarketTickerPulse
      description: Compact interpretation layer for current ticker-level Polymarket data.
    HistoricalLimitErrorDetail:
      properties:
        error:
          type: string
          title: Error
          description: Error type identifier
        message:
          type: string
          title: Message
          description: Human-readable error message
        requested_days:
          type: integer
          title: Requested Days
          description: Number of days requested
        enforced_quantity:
          anyOf:
          - type: string
          - type: 'null'
          title: Enforced Quantity
          description: Quantity checked against the account tier limit
        max_days:
          type: integer
          title: Max Days
          description: Maximum days allowed for account tier
        account_type:
          type: string
          title: Account Type
          description: User's account type (free, hobby, professional, premium)
      type: object
      required:
      - error
      - message
      - requested_days
      - max_days
      - account_type
      title: HistoricalLimitErrorDetail
      description: Structured error detail for historical data limit exceeded.
    PolymarketCompareStockItem:
      properties:
        ticker:
          type: string
          title: Ticker
          description: Stock ticker symbol
        company_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Company Name
          description: Company name from ticker_reference
        buzz_score:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Buzz Score
          description: Buzz score (0-100)
        trend:
          anyOf:
          - type: string
            enum:
            - rising
            - falling
            - stable
          - type: 'null'
          title: Trend
          description: Flow momentum over the current 3 UTC days vs previous 3 UTC days using trades, volume, market breadth and liquidity; not price movement. For `from`/`to`, anchors at `to` (or now when `to` is today). Null when no qualifying activity exists.
        trade_count:
          type: integer
          minimum: 0.0
          title: Trade Count
          description: Trade count in selected period
        market_count:
          type: integer
          minimum: 0.0
          title: Market Count
          description: Distinct markets that existed for ticker within the selected UTC window, counted by market-catalog lifetime overlap
        current_market_count:
          type: integer
          minimum: 0.0
          title: Current Market Count
          description: Number of currently open markets in the latest UTC-day snapshot for ticker; use this for live-only market breadth
        unique_traders:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Unique Traders
          description: Exact distinct union of observed proxy and explicit maker wallet hashes for the delivered scope and UTC window; null when retained wallet-level trades do not fully cover the window; not a complete market-wide participant census
        sentiment_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: -1.0
          - type: 'null'
          title: Sentiment Score
          description: Orderbook-aware implied sentiment; null when no directional sentiment evidence exists in the selected period
        bullish_pct:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Bullish Pct
          description: Outcome-aware bullish market percentage
        bearish_pct:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 0.0
          - type: 'null'
          title: Bearish Pct
          description: Outcome-aware bearish market percentage
        total_liquidity:
          type: number
          minimum: 0.0
          title: Total Liquidity
          description: Windowed aggregated liquidity signal in USD over the selected period; not a current snapshot
        trend_history:
          items:
            type: number
          type: array
          title: Trend History
          description: Recent buzz history (oldest→newest). Length follows the resolved period, with a minimum of 7 values when data exists. Closed historical windows end at `to`. Empty when no qualifying data exists.
      type: object
      required:
      - ticker
      - buzz_score
      - trade_count
      - market_count
      - current_market_count
      - total_liquidity
