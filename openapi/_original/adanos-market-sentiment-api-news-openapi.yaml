  /stock/{ticker}/mentions:
    get:
      tags:
      - News Stocks
      summary: Raw Mentions
      description: 'Returns raw news mention rows for a specific stock ticker within
        the live raw-data retention window.

        **Professional account required.** Free and Hobby accounts cannot use this
        endpoint.


        **Use this endpoint when you need:**

        - article-level snippets

        - original timestamps

        - source attribution for raw rows


        **Notes:**

        - Use `from` and `to` for explicit UTC date windows

        - Results are ordered newest first and support deterministic `offset` + `limit`
        pagination

        - empty result sets return `200` with `results=[]`'
      operationId: getNewsStockMentions
      security:
      - ApiKeyAuth: []
      parameters:
      - name: ticker
        in: path
        required: true
        schema:
          type: string
          pattern: ^\$?(?:[A-Za-z0-9]{1,8}[.-][A-Za-z]|[A-Za-z0-9]{0}[A-Za-z][A-Za-z0-9]{0,9}|[A-Za-z0-9]{1}[A-Za-z][A-Za-z0-9]{0,8}|[A-Za-z0-9]{2}[A-Za-z][A-Za-z0-9]{0,7}|[A-Za-z0-9]{3}[A-Za-z][A-Za-z0-9]{0,6}|[A-Za-z0-9]{4}[A-Za-z][A-Za-z0-9]{0,5}|[A-Za-z0-9]{5}[A-Za-z][A-Za-z0-9]{0,4}|[A-Za-z0-9]{6}[A-Za-z][A-Za-z0-9]{0,3}|[A-Za-z0-9]{7}[A-Za-z][A-Za-z0-9]{0,2}|[A-Za-z0-9]{8}[A-Za-z][A-Za-z0-9]{0,1}|[A-Za-z0-9]{9}[A-Za-z][A-Za-z0-9]{0,0}|[0-9]{3,10})$
          description: Stock ticker symbol (e.g., TSLA, aapl, BRK.A, $GME)
          title: Ticker
        description: Stock ticker symbol (e.g., TSLA, aapl, BRK.A, $GME)
      - name: from
        in: query
        required: false
        schema:
          description: Start date in YYYY-MM-DD. Inclusive UTC date.
          title: From
          type: string
          format: date
        description: Start date in YYYY-MM-DD. Inclusive UTC date.
      - name: to
        in: query
        required: false
        schema:
          description: End date in YYYY-MM-DD. Inclusive UTC date. Omit to use the
            current UTC date.
          title: To
          type: string
          format: date
        description: End date in YYYY-MM-DD. Inclusive UTC date. Omit to use the current
          UTC date.
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          description: Deprecated v1 compatibility shorthand. Prefer `from` and `to`
            for reproducible UTC date windows.
          title: Days
        description: Deprecated v1 compatibility shorthand. Prefer `from` and `to`
          for reproducible UTC date windows.
        deprecated: true
        x-adanos-hide-in-request-client: true
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of raw mentions to return
          default: 50
          title: Limit
        description: Maximum number of raw mentions to return
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
